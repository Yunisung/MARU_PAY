<script>
    //전체선택
    $("input[id='confirm']").on('click', function (event) {
        $("input[type='checkbox']").prop('checked', this.checked)

        if(this.checked){
            $("button[id='next']").addClass('active');
        }else{
            $("button[id='next']").removeClass('active');
        }
    });

    $("label").on('click', function (event) {
        event.stopImmediatePropagation();
    });

    $("label").on('click', function (event) {
        event.stopImmediatePropagation();
    });

    $("#next").on('click', function (event) {
        if($("input[id='agree_01']").is(":checked") && $("input[id='agree_02']").is(":checked") && $("input[id='agree_03']").is(":checked")){

            if($("input[id='initPhoneAuthCheck']").val() == "Y") {
                location.href='/form/payment/totalV2/step_phone.html?token=' + $("input[id='initWebKey']").val();
            } else {
                location.href='/form/payment/totalV2/step_02.html?token=' + $("input[id='initWebKey']").val();
            }


        }
    });

    $("input[type='checkbox']").on('click', function (event) {
        var checked = $(this).is(":checked");

        if (!checked) {
            $("input[id='confirm']").prop('checked', false);

            if(!$("input[id='agree_01']").is(":checked") || !$("input[id='agree_02']").is(":checked") || !$("input[id='agree_03']").is(":checked")){
                $("button[id='next']").removeClass('active');
            }
        }else {
            var is_checked = true;

            $("input[class='agree']").each(function(){
                is_checked = is_checked && $(this).is(":checked");
            });

            if(!checked){
                is_checked = is_checked && $(this).is(":checked");
            }

            if($("input[id='agree_01']").is(":checked") && $("input[id='agree_02']").is(":checked") && $("input[id='agree_03']").is(":checked")){
                $("button[id='next']").addClass('active');
            }

            $("input[id='confirm']").prop('checked', is_checked)
        }

        event.stopPropagation();
    });

    $("div.agree").on('click', function (event) {
        // if(!KWON.util.isMobile()){ //pc 화면
        $(this)
            .next(".agree_text")
            .slideToggle(200);
        $(this)
            .find('i')
            .toggleClass('open')
        // }
    });

    jQuery.fn.serializeObject = function() {
        var obj = null;
        try {
            if (this[0].tagName && this[0].tagName.toUpperCase() == "FORM") {
                var arr = this.serializeArray();
                if (arr) {
                    obj = {};
                    jQuery.each(arr, function() {
                        obj[this.name] = this.value;
                    });
                }//if ( arr ) {
            }
        } catch (e) {
            alert(e.message);
        } finally {
        }

        return obj;
    };
</script>
