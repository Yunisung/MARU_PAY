<script>
    var clickCheck = false;
    var count = 0;

    $("#next").on('click', function (event) {
        if(clickCheck){
            return false;
        }else{
            clickCheck = true;
        }

        $("#accountAuthForm > #bankCd").val($("#userForm > #userBankCd").val());
        $("#accountAuthForm > #account").val($("#userForm > #userAccount").val());
        $("#accountAuthForm > #mchtId").val($("#initData > #initMchtId").val());
        $("#accountAuthForm > #identity").val($("#userForm > #userIdentity").val());
        $("#accountAuthForm > #name").val($("#userForm > #userName").val());
        $("#accountAuthForm > #phoneNo").val($("#userForm > #userPhoneNo").val());
        $("#accountAuthForm > #totalAuthId").val($("#vactResForm > #vactTotalAuthId").val());
        $("#accountAuthForm > #trackId").val($("#initData > #initTrackId").val());

        $("div[class='error_message']").html('<span class="error">계좌점유 인증중입니다.</span>');
        $("button[id='next']").removeClass('active');

        var data = {"totalAuth" : $('#accountAuthForm').serializeObject()};

        loading.start();

        $.ajax({
            type : 'POST',
            url : '/api/account/v2/transfer',
            data : JSON.stringify(data),
            dataType : 'json',
            beforeSend : function(xhr){
                xhr.setRequestHeader("Content-type", "application/json");
                xhr.setRequestHeader("Authorization", $("input[id='initPublicKey']").val());
            },
            success : function(json){
                loading.end();

                if("0000" == json.result.resultCd){
                    KWON.setConfigData2(json.totalAuth.authId);

                    $("#accountAuthForm").attr("action","/form/payment/totalV2/step_03-2.html?token=" + $("input[id='initWebKey']").val()).submit();
                }else if("AAAA" == json.result.resultCd){
                    KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[계좌점유인증 오류]<br>" + json.result.resultMsg + "(" + json.result.advanceMsg + ")<br>확인 후 다시 시도해 주세요.");

                    $("#accountAuthForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
                } else {
                    clickCheck = false;
                    $("button[id='next']").addClass('active');
                    $("div[class='error_message']").html('<span class="error">' + json.result.advanceMsg + '<br>3회실패시 인증이 취소됩니다.</span>');
                    count++;

                    if(count >= 3){
                        KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[계좌점유인증 오류]<br>" + json.result.resultMsg + "(" + json.result.advanceMsg + ")<br>확인 후 다시 시도해 주세요.");

                        $("#accountAuthForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
                    }
                }
            },
            error: function(xhr, status, error){
                loading.end();

                clickCheck = false;
                $("button[id='next']").addClass('active');
                $("div[class='error_message']").html('<span class="error">통신에러<br>3회실패시 인증이 취소됩니다.</span>');

                count++;

                if(count >= 3){
                    KWON.setErrMsg("9999", "계좌점유인증 통신에러", "[계좌점유인증 오류]<br>통신에러" + "<br>가맹점에 문의해 주세요.");

                    $("#accountAuthForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
                }
            }
        });
    });

    jQuery.fn.serializeObject = function() {
        var obj = null;
        try {
            if (this[0].tagName && this[0].tagName.toUpperCase() == "FORM") {
                var arr = this.serializeArray();
                if (arr) {
                    obj = {};

                    jQuery.each(arr, function() {
                        obj[this.name] = this.value;
                    });
                }//if ( arr ) {
            }
        } catch (e) {
            alert(e.message);
        } finally {
        }

        return obj;
    };
</script>
