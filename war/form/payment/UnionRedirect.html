<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedirectURL</title>
    
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
</head>
<body>
<script>
    // URL 파라미터 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const rawResult = urlParams.get('result');

    let trim = rawResult;

    // '승인실패' 포함 시 정제
    if (rawResult && rawResult.includes("승인실패")) {
        trim = rawResult.replace(/\\/g, '').replace(/^"/, '').replace(/"$/, '');
    } else if (rawResult && rawResult.includes("승인")) {
        if (rawResult.charAt(0) === '"') {
            trim = rawResult.replace(/\\/g, '').replace(/^"/, '').replace(/"$/, '');
        }
    }

    let obj = {};
    try {
        obj = JSON.parse(trim);
    } catch (e) {
        console.error('JSON 파싱 오류:', e);
    }

    window.onload = function () {
        const safeHtml = `
      <h3>Redirect Response</h3>
      <div>resultMsg: ${escapeHtml(obj?.result?.resultMsg || '')}</div>
      <div>resultCd: ${escapeHtml(obj?.result?.resultCd || '')}</div>
      <div>advanceMsg: ${escapeHtml(obj?.result?.advanceMsg || '')}</div>
      <br>
      <div>전문</div>
      <pre>${escapeHtml(trim)}</pre>
    `;
        document.body.innerHTML = safeHtml;
    };

    //HTML 이스케이프 함수 (XSS 방지 핵심)
    function escapeHtml(unsafe) {
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
