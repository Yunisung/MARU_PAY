<!DOCTYPE html>
<head>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .center-wrapper {
            display: table;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        .center-content {
            display: table-cell;
            vertical-align: middle;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
    <meta charSet="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content="Smartro"/>
    <title>SmartroPAY 연동가이드</title>

    <script>
        var today = new Date();
        var formattedDate = today.getFullYear() +
            ("0" + (today.getMonth() + 1)).slice(-2) +
            ("0" + today.getDate()).slice(-2);

        var script = document.createElement("script");
        script.src = "https://pay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=" + formattedDate;
        document.head.appendChild(script);

        function _close() {
            var obj = {
                type: 'PAY_CLOSE'
            };

            if (window.opener) {
                window.opener.postMessage(JSON.stringify(obj), "*");
            } else {
                window.parent.postMessage(JSON.stringify(obj), "*");
            }

        }
        function goPay() {

            // 스마트로페이 초기화
            smartropay.init({
                mode: 'REAL', // STG: 테스트, REAL: 운영
                actionUri: '/ssb/interface.do'
            });
            // 스마트로페이 빌링키 발급요청
            smartropay.payment({
                FormId: 'rebillForm' // 폼ID
            });
        }
    </script>

    <!-- PC 연동 시 script. 캐시방지를 위해 ?version=today를 추가 -->
    <!-- 운영 전환 시 "https://pay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=현재일자" 로 변경 -->
<!--    <script src="https://tpay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=현재일자"></script>-->

    <!-- 모바일 연동 시 script. 캐시방지를 위해 ?version=today를 추가 -->
    <!-- 운영 전환 시 "https://mpay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=현재일자" 로 변경 -->
<!--    <script src="https://tmpay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=현재일자"></script>-->
</head>
<body>
<div class="center-wrapper">
    <div class="center-content">
        <form name="KSPayForm" method="post">
            <table border="0" width="100%" height="100%">
                <tr>
                    <td align=center valign="middle">
                        <table width=320 cellspacing=0 cellpadding=0 border=0 bgcolor=#4F9AFF>
                            <tr>
                                <td>
                                    <table width=100% cellspacing=1 cellpadding=2 border=0>
                                        <tr bgcolor=#4F9AFF height=25>
                                            <td align=left><font color="#FFFFFF">
                                                카드 등록
                                            </font></td>
                                        </tr>
                                        <tr bgcolor=#FFFFFF>
                                            <td valign=top>
                                                <table width=100% cellspacing=0 cellpadding=2 border=0>
                                                    <tr>
                                                        <td align=left>
                                                            <table>
                                                                <tr><td colspan=2 align=center><HR></td></tr>

                                                                <tr>
                                                                    <td colspan=2>"다음"버튼을 클릭하시고 팝업창의 안내에 따라 진행하세요.</td>
                                                                </tr>
                                                                <tr>
                                                                    <td colspan=2 align=center>
                                                                        <input type=button onclick="javascript:goPay();" value="다음">
                                                                        <input type=button onclick="javascript:_close();" value="닫기">
                                                                    </td>
                                                                </tr>

                                                            </table></tr></table></td></tr></table></td></tr>
                        </table></td></tr></table></td></tr></table></table>
        </form>
    </div>
</div>

<script src="/js/rebillScriptLoader.js?v=1"></script>
</body>
</html>
