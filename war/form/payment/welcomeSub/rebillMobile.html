    <script>
        var today = new Date();
        var formattedDate = today.getFullYear() +
            ("0" + (today.getMonth() + 1)).slice(-2) +
            ("0" + today.getDate()).slice(-2);

        var script = document.createElement("script");
        script.src = "https://mpay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=" + formattedDate;
        document.head.appendChild(script);
    </script>

    <!-- PC 연동 시 script. 캐시방지를 위해 ?version=today를 추가 -->
    <!-- 운영 전환 시 "https://pay.smartropay.co.kr/asset/js/SmartroPAY-1.0.min.js?version=현재일자" 로 변경 -->

    <script type="text/javascript">

        function goPay() {

            // 스마트로페이 초기화
            smartropay.init({
                mode: 'STG', // STG: 테스트, REAL: 운영
                actionUri: '/ssb/interface.do'
            });
            // 스마트로페이 빌링키 발급요청
            smartropay.payment({
                FormId: 'rebillForm' // 폼ID
            });
        }
    </script>
