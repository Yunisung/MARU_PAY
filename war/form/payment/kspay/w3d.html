<!DOCTYPE html>
<html lang="en" style="height:100%;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" type="text/css" href="/static/css/index.css">
  <link rel="stylesheet" type="text/css" href="/static/css/spinner.css">
  <script>
   window.focus();
   </script>
  <title>MTouch</title>
</head>
<body class="c3-body">
  <div class="c3-header">
    <span id="c3-btn-close" aria-label="Close"></span>
    <div class="c3-logo">
      <img id="c3-logo-img" src="/static/img/logo.png">
    </div>
  </div>
  <div class="c3-content">
    <div class="contant-wrapper">
      <div class="row c3-money-wrapper">
          <div class="c3-money-tag-wrapper">
            <div class="c3-money-tag c3-tag">결제 금액</div>
            <div class="c3-product-tag c3-tag" id="c3-product-tag"></div>
          </div>
          <span class="c3-money">₩<span id="w3damount"></span></span>
      </div>
      <div class="row">
          <span class="c3-card-tag c3-tag">카드번호</span>
          <span class="c3-card">
            <input type="text" name="cardno" class="c3-input c3-input-card" id="cardno" maxlength="19" value="" tabindex="1">
          </span>
      </div>
      <div class="row">
          <div class="c3-left-containner">
              <span class="c3-expiry-tag c3-tag">유효기간</span>
              <span class="c3-expiry">
                  <div class="c3-expiry-month">
                    <select class="c3-select-left" name="expmon" id="expmon" tabindex="2">
                      <option value="01">01</option>
                      <option value="02">02</option>
                      <option value="03">03</option>
                      <option value="04">04</option>
                      <option value="05">05</option>
                      <option value="06">06</option>
                      <option value="07">07</option>
                      <option value="08">08</option>
                      <option value="09">09</option>
                      <option value="10">10</option>
                      <option value="11">11</option>
                      <option value="12">12</option>
                    </select>
                  </div>
                  <div class="c3-expiry-year">
                      <select class="c3-select-right" name="expyear" id="expyear" tabindex="3">
                      </select>
                    </div>
              </span>
          </div>
          <div class="c3-right-containner">
              <span class="c3-installment-tag c3-tag">할부</span>
              <span class="c3-installment">
                <select class="c3-select" name="installment" id="installment" tabindex="4">
                </select>
              </span>
          </div>
      </div>
      
      <div class="seprator"></div>
      <div class="row">
          <a href="javascript:void(0);" class="btn green" id="c3-btn-pay" onclick="javascript:submitW3d()" tabindex="-1">해외안심클릭</a>
      </div>
    </div>
  </div>

<div class="" id="c3-loading" style="display: none;">
    <div class="spinner">
      <div class="rect1"></div>
      <div class="rect2"></div>
      <div class="rect3"></div>
      <div class="rect4"></div>
      <div class="rect5"></div>
    </div>
    <div class="loading-tag">Loading...</div>  
  </div>
  
<!--Visa3d인증에 사용될 인자들-->
<IFRAME id=ILKFRAME name=ILKFRAME style="display:none" src="blank.html"></IFRAME>

<div style="display:none"> 
<FORM name=Visa3d action="https://kspay.ksnet.to/abroadMPI/veri_host.jsp"  target="ILKFRAME" method=post accept-charset="euc-kr">
	<INPUT type="hidden"		name="returnUrl"		value=""					>	
	<INPUT type="hidden"		name="pan"				value=""					>
	<INPUT type="hidden"		name="expiry"			value=""					>
	<INPUT type="hidden"		name="purchase_amount"	value=""					>
	<INPUT type="hidden"		name="amount"			value=""					>
	<INPUT type="hidden"		name="exponent"			value=""					>
	<INPUT type="hidden"		name="currency"			value=""					>
	<INPUT type="hidden"		name="recur_frequency"	value=""					>
	<INPUT type="hidden"		name="recur_expiry"		value=""					>
	<INPUT type="hidden"		name="userid"			value=""					>
	<INPUT type="hidden"		name="transID"			value=""					>
	<INPUT type="password"		name="dummy"			value=""					>
	<INPUT type="hidden"		name="country"			value="410"					>
	<INPUT type="hidden"		name="installments"		value=""					>   
	<INPUT type="hidden"		name="name"				value=""					>	
	<INPUT type="hidden"		name="url"				value=""					>	
	<INPUT type="hidden"		name="hostid"			value=""					>
	<INPUT type="hidden"		name="hostpwd"			value=""					>
	<INPUT type="hidden"		name="description"		value="none"				>
	<INPUT type="hidden"		name="device_category"	value="0"					>
	<INPUT type="hidden"		name="useActiveX"		value="0"					>
	<input type="hidden"		name="instType"			value=""					>
	<input type="hidden"		name="cardcode"			value=""					>
	<input type="hidden"		name="bizNo"			value=""					>
	<input type="hidden"		name="merInfo"			value=""					>
		
</FORM>
</div>
<!------------------------------------ ILK Modification end ----------------------------------------->
<script src="/static/js/kspayW3d.js?v=5" charset="utf-8"></script>
</body>
</html>
