<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
    <meta charset="utf-8">
    <title>CREDITOP SSG 간편결제 </title>
    <script>
        function submitAuth() {
            var ssgfrm = document.ssgFrm;
            var frm    = document.KSPayInputForm;
            for(var i=0 ; i<frm.certitype.length ; i++)
            {
                if(frm.certitype[i].checked == true)
                {
                    ssgfrm.sndCertitype.value = frm.certitype[i].value ;
                }
            }


            ssgfrm.action ='https://kspay.ksnet.to/store/PAY_PROXY/ssg/ssg_proxy.jsp';
            ssgfrm.submit();
        }
    </script>
    <style type="text/css">
        TABLE{font-size:9pt; line-height:160%;}
        A {color:blueline-height:160% background-color:#E0EFFE}
        INPUT{font-size:9pt}
        SELECT{font-size:9pt}
        .emp{background-color:#FDEAFE}
        .white{background-color:#FFFFFF color:black border:1x solid white font-size: 9pt}
    </style>
</head>

<body topmargin=0 leftmargin=0 marginwidth=0 marginheight=0 onFocus="" >
<form name="KSPayInputForm">
    <table border=0 width=0>
        <tr>
            <td align=center>
                <table width=280 cellspacing=0 cellpadding=0 border=0 bgcolor=#4F9AFF>
                    <tr>
                        <td>
                            <table width=100% cellspacing=1 cellpadding=2 border=0>
                                <tr bgcolor=#4F9AFF height=25>
                                    <td align=left><font color="#FFFFFF">
                                        SSG 인증 요청
                                    </font></td>
                                </tr>
                                <tr bgcolor=#FFFFFF>
                                    <td valign=top>
                                        <table width=100% cellspacing=0 cellpadding=2 border=0>
                                            <tr>
                                                <td align=left>
                                                    <table>
                                                        <tr>
                                                            <td>상품명 :</td>
                                                            <td id="goodname"><%=goodname%></td>
                                                        </tr>
                                                        <tr>
                                                            <td>금액 :</td>
                                                            <td id="amount"><%=amount%></td>
                                                        </tr>
                                                        <tr>
                                                            <td colspan=3><hr noshade size=1></td>
                                                        </tr>
                                                        <tr>
                                                            <td>신용카드종류 :</td>
                                                            <td>
                                                                <INPUT TYPE="radio" NAME="certitype" value="2" checked>SSG 신용<br>
                                                                <INPUT TYPE="radio" NAME="certitype" value="1">SSG 머니<br>
                                                            </td>
                                                        </tr>
                                                        <tr>
                                                            <td colspan=2 align=center>
                                                                <input type=button onclick="javascript:submitAuth()" value="결제요청">
                                                            </td>
                                                        </tr>

                                                    </table>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
    </td>
    </tr>
    </table>
    </table>
</form>
<script src="/static/js/ssgMobile.js?v=1"></script>
<div id="iframe-payment-containner">
    <iframe id="iframe-payment" style="width:100%;height:100%;background-color:transparent;border-radius: 6px;display:none;" frameborder="0" allowtransparency="true" src=""></iframe>
</div>
</body>
</html>
