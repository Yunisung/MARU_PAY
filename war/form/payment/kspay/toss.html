    <script language="javascript">
        function openToss()
        {
            var bank_frm	= document.BankFrm;
            var submit_frm	= document.kspayForm;

            var height_ = 550;//360;
            var width_ = 400;//320
            var left_ = screen.width;
            var top_ = screen.height;

            left_ = left_/2 - (width_/2);
            top_ = top_/2 - (height_/2);

            try
            {
                var op = window.open('about:blank','BankFrmUp',
                    'height='+height_+',width='+width_+',status=yes,scrollbars=no,resizable=no,left='+left_+',top='+top_+'');

                if (op == null)
                {
                    alert("팝업이 차단되어 결제를 진행할 수 없습니다.");
                    return false;
                }
                bank_frm.target = 'BankFrmUp';

            }catch(e)
            {
                alert("팝업실패("+(e.number & 0xFFFF)+":"+e.description+")");
            }

            bank_frm.action ='https://kspay.ksnet.to/store/PAY_PROXY/toss/toss_cert_rs.jsp'; // 개발: https://pgdev.ksnet.co.kr , 운영:https://kspay.ksnet.to/
            bank_frm.submit();
        }

        function proceed(arg)
        {
            var frm = document.kspayForm;
            if(arg == "true"){
                if(frm.payMethod.value == "RESELLER_CARD"){
                    //신용카드
                    submitCard() ;
                }else if(frm.payMethod.value == "TOSS_MONEY"){
                    submitMoney() ;
                }else{
                }
            }else{
                // 인증실패.
            }
        }
    </script>
