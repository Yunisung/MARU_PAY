<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" >
    <meta charset="utf-8">
    <title>CREDITOP TOSS 간편결제 </title>
    <script language="javascript">

        function _submit()
        {
            var vfrm = document.kfrm;


            vfrm.action = "https://kspay.ksnet.to/store/PAY_PROXY/toss/toss_cert_rs.jsp" ;
            vfrm.submit();
        }

        function _close() {
            var obj = {
                type: 'PAY_CLOSE'
            };

            if (window.opener) {
                window.opener.postMessage(JSON.stringify(obj), "*");
            } else {
                window.parent.postMessage(JSON.stringify(obj), "*");
            }

        }

    </script>
    <style type="text/css">
        TABLE{font-size:9pt; line-height:160%;}
        A {color:blueline-height:160% background-color:#E0EFFE}
        INPUT{font-size:9pt}
        SELECT{font-size:9pt}
        .emp{background-color:#FDEAFE}
        .white{background-color:#FFFFFF color:black border:1x solid white font-size: 9pt}
    </style>
</head>
<body topmargin=0 leftmargin=0 marginwidth=0 marginheight=0 onFocus="" >
<form name="KSPayForm" method="post">
    <table border=0 width=0>
        <tr>
            <td align=center>
                <table width=320 cellspacing=0 cellpadding=0 border=0 bgcolor=#4F9AFF>
                    <tr>
                        <td>
                            <table width=100% cellspacing=1 cellpadding=2 border=0>
                                <tr bgcolor=#4F9AFF height=25>
                                    <td align=left><font color="#FFFFFF">
                                        토스 기본 거래정보
                                    </font></td>
                                </tr>
                                <tr bgcolor=#FFFFFF>
                                    <td valign=top>
                                        <table width=100% cellspacing=0 cellpadding=2 border=0>
                                            <tr>
                                                <td align=left>
                                                    <table>
                                                        <tr>
                                                            <td>상품명 :</td>
                                                            <td id="goodname"></td>
                                                        </tr>
                                                        <tr>
                                                            <td>금액 :</td>
                                                            <td id="amount"></td>
                                                        </tr>
                                                        <tr>
                                                            <td colspan=3><hr noshade size=1></td>
                                                        </tr>
                                                        <tr>
                                                            <td colspan=3>
                                                                <p>
                                                                    은행별 서비스 정기점검 시간에 서비스 불가<br>
                                                                    TossPay에 가입한 고객 대상 간편결제</p>
                                                            </td>
                                                        </tr>
                                                        <tr><td colspan=2 align=center><HR></td></tr>

                                                        <tr>
                                                            <td colspan=2>"다음"버튼을 클릭하시고 팝업창의 안내에 따라 진행하세요.</td>
                                                        </tr>
                                                        <tr>
                                                            <td colspan=2 align=center>
                                                                <input type=button onclick="javascript:_submit(this.form);" value="다음">
                                                                <input type=button onclick="javascript:_close();" value="닫기">
                                                            </td>
                                                        </tr>

                                                    </table></tr></table></td></tr></table></td></tr>
                </table></td></tr></table></td></tr></table></table>
</form>
<script src="/js/tossMobile.js?v=1"></script>

</div>
