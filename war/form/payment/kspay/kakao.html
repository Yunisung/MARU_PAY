    <script language="javascript">

        var op_check = false;
        function _submit()
        {
            if(op_check)return;

            var vfrm = document.kfrm;

            if (parseInt(document.KSPayAuthForm.amount.value,10) < 50000 && parseInt(document.KSPayInputForm.installment.value,10) > 0)
            {
                alert("5만원이상 할부가능");
                return;
            }

            if(document.KSPayInputForm.ptype[0].checked)
            {
                vfrm.paymenttype.value=document.KSPayInputForm.ptype[0].value;
            }else{
                vfrm.paymenttype.value=document.KSPayInputForm.ptype[1].value;
            }

            vfrm.installment.value = document.KSPayInputForm.installment.value;

            document.getElementById("DIV_KAKAOFRAME").style.display="";
            vfrm.returnUrl += "/"+vfrm.installment.value;
            vfrm.target = 'KAKAO_IFRM';
            vfrm.acceptCharset = "euc-kr";
            vfrm.action = "https://kspay.ksnet.to/store/PAY_PROXY/kakao/kakao_rs_o1.jsp" ;
            // vfrm.action = "http://127.0.0.1:10002/api/kakao/return";
            vfrm.submit();


        }

        function getLocalUrl(mypage)
        {
            var myloc = location.href;
            return myloc.substring(0, myloc.lastIndexOf('/')) + '/' + mypage;
        }

        function recvResult(proceed,tid ,cid,token )
        {
            var frm = document.KSPayAuthForm;

            if ( token != "" && proceed == "true")
            {
                frm.tid.value=tid;
                frm.cid.value=cid;
                frm.pg_token.value=token;
                submitAuth();
                return;
            }else{
                //취소처리부분.
                op_check = false ;
                return;
            }
        }

        function submitAuth()
        {
            var frm = document.KSPayAuthForm;
            frm.action = "KSPayCreditPostK";
            frm.submit();
        }
    </script>
