    <title>CREDITOP NAVER 간편결제 </title>
    <script language="javascript">
        var op_check = false;
        function _submit()
        {
            if(op_check)return;
            var vfrm = document.kfrm;

            var width_	= 750;
            var height_	= 850;
            var left_	= screen.width;
            var top_	= screen.height;

            left_ = left_/2 - (width_/2);
            top_ = top_/2 - (height_/2);

            op = window.open("",'AuthFrmUp',
                'height='+height_+',width='+width_+',status=yes,scrollbars=no,resizable=no,left='+left_+',top='+top_+'');

            if (op == null)
            {
                alert("팝업이 차단되어 결제를 진행할 수 없습니다.");
                return false;
            }

            var call_url = "https://kspay.ksnet.to/store/PAY_PROXY/npay/naver_rs_o1.jsp";
            // var call_url = "http://127.0.0.1:10002/api/naver/return";

            vfrm.target = 'AuthFrmUp';
            vfrm.action = call_url;
            vfrm.submit();
        }

        function getLocalUrl(mypage)
        {
            var myloc = location.href;
            return myloc.substring(0, myloc.lastIndexOf('/')) + '/' + mypage;
        }

        function recvResult(proceed, cardNumber, cardExpiredDate, cardCode, paymentId, installment, cavv, xid, eci, trid)
        {
            var frm = document.KSPayAuthForm;

            if (proceed == "true")
            {
                frm.cardnumber.value=cardNumber;
                frm.expdt.value=cardExpiredDate;
                frm.cardcode.value=cardCode;
                frm.paymentid.value=paymentId;
                frm.installment.value=installment;
                frm.cavv.value=cavv;
                frm.xid.value=xid;
                frm.eci.value=eci;
                frm.trid.value=trid;

                submitAuth();
                return;
            }else{
                //취소처리부분.
                op_check = false ;
                return;
            }
        }

        function submitAuth()
        {
            var frm = document.KSPayAuthForm;
            frm.action = "./KSPayCreditPostN.jsp";
            frm.submit();
        }
    </script>
