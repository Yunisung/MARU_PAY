	<script>
       	var clickCheck = false;
       	var count = 0;
       	
       	$("#next").on('click', function (event) {
        	if($("select[id='paramBankCd']").val() == ""){
        		$("div[class='error_message']").html('<span class="error">은행을 선택해주세요.</span>');
        		$("select[id='paramBankCd']").focus();
        		
        		return false;
        	}
        	
        	if($("input[id='paramAccount']").val() == ""){
        		$("div[class='error_message']").html('<span class="error">계좌번호를 넣어주세요.</span>');
        		$("input[id='paramAccount']").focus();
        		
        		return false;
        	}
        	
        	if(clickCheck){
        		return false;
        	}else{
        		clickCheck = true;
        	}
        	
        	$("#holderNameForm > #bankCd").val($("select[id='paramBankCd']").val());
        	$("#holderNameForm > #bankName").val($("select[id='paramBankCd'] option:checked").text());
        	$("#holderNameForm > #account").val($("input[id='paramAccount']").val());
        	$("#holderNameForm > #identity").val($("input[id='paramIdentity']").val());
        	$("#holderNameForm > #name").val($("input[id='paramName']").val());
        	$("#holderNameForm > #phoneNo").val($("input[id='paramPhoneNo']").val());
        	$("#holderNameForm > #mchtId").val($("#initData > #initMchtId").val());
        	$("#holderNameForm > #trackId").val($("#initData > #initTrackId").val());
   
        	$("div[class='error_message']").html('<span class="error">은행에 확인중입니다.</span>');
        	$("button[id='next']").removeClass('active');

        	var data = {"totalAuth" : $('#holderNameForm').serializeObject()};
        	
        	loading.start();
        	
   			$.ajax({
   				type : 'POST', 
   				url : '/api/account/holder', 
   				data : JSON.stringify(data),
   				dataType : 'json', 
   				beforeSend : function(xhr){ 
   		            xhr.setRequestHeader("Content-type", "application/json");
   					xhr.setRequestHeader("Authorization", $("input[id='initPublicKey']").val());
   				}, 
   				success : function(json){
   					loading.end();
   					
   					if("0000" == json.result.resultCd){
						if(json.totalAuth.holder != $("#holderNameForm > #name").val()){
							clickCheck = false;
       						$("button[id='next']").addClass('active');
       						$("div[class='error_message']").html('<span class="error">예금주명과 실명이 다릅니다.<br>3회실패시 인증이 취소됩니다. 고객정보를 확인해주세요.</span>');
       						count++;
	       						
 	       					if(count >= 3){
 	       						KWON.setErrMsg("9999", "예금주명상이", "[실명인증 오류]<br>예금주명과 실명이 다릅니다.<br>고객정보를 확인해주세요.");

								$("#holderNameForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
							}
						}else{
							KWON.setConfigData(
								$("#holderNameForm > #bankCd").val(),
					        	$("#holderNameForm > #bankName").val(),
					        	$("#holderNameForm > #account").val(),
					        	$("#holderNameForm > #identity").val(),
					        	$("#holderNameForm > #name").val(),
					        	$("#holderNameForm > #phoneNo").val(),
					        	json.totalAuth.totalAuthId
							);
        						
							$("#holderNameForm").attr("action","/form/payment/total/step_03-1.html?token=" + $("input[id='initWebKey']").val()).submit();
						}
   					}else if("AAAA" == json.result.resultCd){
   						KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[실명인증 오류]<br>" + json.result.resultMsg + "(" + json.result.advanceMsg + ")<br>확인 후 다시 시도해 주세요.");
						$("#holderNameForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
		   			}else {
   						clickCheck = false;
   						$("button[id='next']").addClass('active');
   						$("div[class='error_message']").html('<span class="error">' + json.result.resultMsg + ' [' + json.result.advanceMsg + ']<br>3회실패시 인증이 취소됩니다.</span>');
						count++;
			
						if(count >= 3){	
							KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[실명인증 오류]<br>" + json.result.resultMsg + "(" + json.result.advanceMsg + ")<br>확인 후 다시 시도해 주세요.");
							$("#holderNameForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
						}
   					}
   				},
   				error: function(xhr, status, error){ 
   					loading.end();
   					
   					clickCheck = false;
   					$("button[id='next']").addClass('active');
   					$("div[class='error_message']").html('<span class="error">통신에러</span>');
   					count++;
		
					if(count >= 3){
						KWON.setErrMsg("9999", "실명인증 기타오류", "[실명인증 오류]<br>통신에러" + "<br>가맹점에 문의해 주세요.");
						
						$("#accountAuthForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
					}
   				}
   			});
        });
        
        jQuery.fn.serializeObject = function() {
	    	var obj = null;
	        try {
	            if (this[0].tagName && this[0].tagName.toUpperCase() == "FORM") {
	                var arr = this.serializeArray();
	                if (arr) {
	                    obj = {};

	                    jQuery.each(arr, function() {
	                        obj[this.name] = this.value;
	                    });
	                }//if ( arr ) {
	            }
	        } catch (e) {
	            alert(e.message);
	        } finally {
	        }
	     
	        return obj;
	    };
	</script>
