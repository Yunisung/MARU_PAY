            crossorigin="anonymous"
            referrerpolicy="no-referrer"/>
        <title>ARS 인증</title>
	<script type="text/javascript">
    	$(function(){
    		$("#arsBtn").click(function(){
    			
    			/* DATA SET */
    			$("#arsForm > #mchtId").val($("#initData > #initMchtId").val());
    			
    			$("#arsForm > #bankCd").val($("#userForm > #userBankCd").val());
    			$("#arsForm > #accountNo").val($("#userForm > #userAccount").val());
    			$("#arsForm > #mchtCustNm").val($("#userForm > #userName").val());
    			
    			var identity = $("#userForm > #userIdentity").val();
    			var authNo =  identity.substring(0, 2);
    			$("#arsForm > #authNo").val(authNo);
    			
    			$("#arsForm > #phoneNo").val($("#userForm > #userPhoneNo").val());
    			$("#arsForm > #identity").val($("#userForm > #userIdentity").val());
    			$("#arsForm > #totalAuthId").val($("#vactResForm > #vactTotalAuthId").val());
    			$("#arsForm > #mchtTrxId").val($("#initData > #initTrackId").val());
    			
    			var data = {"ars" : $('#arsForm').serializeObject()};


        		if("REQ" == $("#arsType").val()){
        			$("#reqErrorTextArea").hide();

        			$.ajax({
        				type : 'POST', 
        				url : '/api/ars/v2/auth/async',
        				data : JSON.stringify(data),
        				dataType : 'json', 
        				beforeSend : function(xhr){ 
        		            xhr.setRequestHeader("Content-type", "application/json");
        					xhr.setRequestHeader("Authorization", $('#initPublicKey').val());
        				}, 
        				success : function(json){
        					//alert(json.result.resultCd);
        					// $("#trxId").val(json.ars.trxId);
        					
        					if("0000" == json.result.resultCd){
        						// 요청 성공
        						$("#arsType").val("CHK");
        						$("#arsBtn").text("인증 완료");
        						
        						$("#arsReq").hide();
        						$("#arsChk").show();

                                $("#arsForm > #authId").val(json.ars.authId);
                                $("#arsForm > #firmIdx").val(json.ars.firmIdx);

        					}else if("AAAA" == json.result.resultCd){
        						KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[ARS인증 오류]<br>" + json.result.resultMsg + "(" + json.result.advanceMsg + ")<br>확인 후 다시 시도해 주세요.");
        						
    							$("#arsForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
          					} else {
        						// 요청 실패
        						$("#reqErrorTextArea").show();
        					}
        				},
        				error: function(xhr, status, error){ 
        					//alert(error);
        					$("#reqErrorTextArea").show();
        				}
        			});
    			} else if("CHK" == $("#arsType").val()){
    				$("#reqErrorTextArea").hide();
    				$("#errorTextArea").hide();
    				$.ajax({
        				type : 'POST', 
        				url : '/api/ars/v2/auth/check',
        				data : JSON.stringify(data),
        				dataType : 'json', 
        				beforeSend : function(xhr){ 
        		            xhr.setRequestHeader("Content-type", "application/json");
        					xhr.setRequestHeader("Authorization", $('#initPublicKey').val());
        				},
        				success : function(json){
        					if("000" == json.result.resultCd){
	        					// 인증 진행 중
	        					$("#errorTextArea").show();
        					} else if("0000" == json.result.resultCd){
        						KWON.totalAuthConfirm(
        								json.result.resultCd,
        								json.result.resultMsg,
        								"통합인증이 정상적으로 완료되었습니다."
        						);
        					} else {
        						// 인증 실패
        						KWON.setErrMsg(json.result.resultCd, json.result.resultMsg, "[ARS인증 오류]<br>" + json.result.resultMsg + "<br>확인 후 다시 시도해 주세요.");
        						
        						$("#arsForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
        					}
        				}, 
        				error: function(xhr, status, error){ 
        					KWON.setErrMsg("9999", "ARS인증 통신에러", "[ARS인증 오류]<br>통신에러" + "<br>가맹점에 문의해 주세요.");
        					
        					$("#arsForm").attr("action","/form/payment/total/step_error.html?token=" + $("input[id='initWebKey']").val()).submit();
        				}
        			});
    			}
    		});
    	});
    	
    	jQuery.fn.serializeObject = function() {
	    	var obj = null;
	        try {
	            if (this[0].tagName && this[0].tagName.toUpperCase() == "FORM") {
	                var arr = this.serializeArray();
	                if (arr) {
	                    obj = {};
	                    jQuery.each(arr, function() {
	                        obj[this.name] = this.value;
	                    });
	                }//if ( arr ) {
	            }
	        } catch (e) {
	            alert(e.message);
	        } finally {
	        }
	     
	        return obj;
	    };
    </script>
    </head>

		                <span class="error">ARS 요청이 실패하였습니다. 다시 시도해 주세요.</span>
		            </div>
